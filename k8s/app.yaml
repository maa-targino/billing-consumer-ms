apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-consumer-ms
  labels:
    app: billing-consumer-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-consumer-ms
  template:
    metadata:
      labels:
        app: billing-consumer-ms
    spec:
      containers:
        - name: billing-consumer-ms
          image: billing-consumer-ms:latest
          imagePullPolicy: Never
          env:
            # Sobrescreve os defaults de localhost do application.properties (usados no
            # desenvolvimento local via IDE) pelos nomes de Service internos do cluster.
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/billing_db
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq-service
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              value: guest
            - name: SPRING_RABBITMQ_PASSWORD
              value: guest
