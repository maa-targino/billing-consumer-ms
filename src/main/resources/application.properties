spring.application.name=billing-consumer-ms
# NodePort do postgres-service, mesmo motivo do rabbitmq abaixo: evita depender de
# kubectl port-forward. Se o minikube for reiniciado, o IP pode mudar - conferir com
# `minikube ip`.
spring.datasource.url=jdbc:postgresql://172.26.30.154:30709/billing_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# NodePort do rabbitmq-service: evita depender de kubectl port-forward, que cai
# em conexoes de longa duracao como o @RabbitListener. Se o minikube for reiniciado,
# o IP pode mudar - conferir com `minikube ip`.
spring.rabbitmq.host=172.26.30.154
spring.rabbitmq.port=31449
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.acknowledge-mode=auto
# false e o que faz a mensagem ir para a DLQ depois das tentativas, em vez de voltar
# para a fila em loop infinito
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
